name: Dot Product
description: 'Dot Product is a San Francisco AI startup founded in 2024 by Usman Masood (former CTO
  of Pipe and engineering manager at Stripe) and Maksim Stepanenko (previously at Coinbase, Primer,
  Locu, and the MIT Media Lab). The company builds "Operator," a platform of voice-first AI coworkers
  (agents) for operations and customer-support teams: AI agents that follow company-specific playbooks,
  provide 24/7 phone/voice support, and scale to fluctuating demand as an alternative to traditional
  call centers. Dot Product raised a $6M seed round led by Index Ventures with participation from Lachy
  Groom. As of this enrichment pass the company operates in stealth: the product surface (operator.xyz)
  does not resolve publicly and dotproduct.xyz is parked, so no public API, developer docs, SDKs, or
  machine-readable specifications could be verified. Sector: ai-ml.'
